<!DOCTYPE html>
<html>
<head><title>PDF Extractor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
<h2>PDF Text Extractor</h2>
<input type="file" id="pdfInput" accept=".pdf">
<label>Password: <input type="text" id="pwd" value="73096218"></label>
<button onclick="extract()">Extract</button>
<pre id="output" style="white-space:pre-wrap; font-size:11px; max-height:90vh; overflow:auto;"></pre>
<script>
async function extract() {
    const file = document.getElementById('pdfInput').files[0];
    if (!file) return alert('Select a PDF');
    const password = document.getElementById('pwd').value;
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const buffer = await file.arrayBuffer();
    let doc;
    try { doc = await pdfjsLib.getDocument({data: buffer, password}).promise; }
    catch(e) {
        try { doc = await pdfjsLib.getDocument({data: buffer, password: 'CC'+password}).promise; }
        catch(e2) { return document.getElementById('output').textContent = 'Error: ' + e2.message; }
    }
    let fullText = '';
    for (let i = 1; i <= doc.numPages; i++) {
        const page = await doc.getPage(i);
        const content = await page.getTextContent();
        fullText += `\n=== PAGE ${i} ===\n`;
        fullText += content.items.map(item => item.str).join(' ') + '\n';
    }
    document.getElementById('output').textContent = fullText;
    
    // Also try to parse the tables
    let analysis = '\n\n=== ANALYSIS ===\n';
    
    // Pre-1995 regex
    const pre95Regex = /(\d{5,15})\s+([^\n\r]{3,60}?)\s+(\d{1,2}\s*[\/\-]\s*\d{1,2}\s*[\/\-]\s*\d{4})\s+(\d{1,2}\s*[\/\-]\s*\d{1,2}\s*[\/\-]\s*\d{4})\s+\$?\s*([\d.,]+)\s+([\-\d.,]+)/g;
    let m, pre95Count = 0, pre95Dias = 0;
    let pre95Text = fullText;
    const splitIdx = fullText.search(/PAGOS\s+EFECTUADOS\s+A\s+PARTIR\s+DE\s+1995/i);
    if (splitIdx > -1) pre95Text = fullText.substring(0, splitIdx);
    
    analysis += '\n--- PRE-1995 ROWS ---\n';
    while ((m = pre95Regex.exec(pre95Text)) !== null) {
        const emp = m[2].trim().toUpperCase();
        if (emp.includes('RAZÓN SOCIAL') || emp.includes('ADMINISTRADORA') || emp.includes('NOMBRE AFILIADO') || emp === 'NIT') continue;
        const ibc = parseFloat(m[5].replace(/\./g,'').replace(',','.'));
        const dias = parseFloat(m[6].replace(/\./g,'').replace(',','.'));
        if (ibc < 1000 || dias === 0) continue;
        if (Math.abs(dias) > 5000) continue;
        pre95Count++;
        pre95Dias += dias;
        analysis += `  ${pre95Count}. NIT:${m[1]} | ${m[2].trim()} | ${m[3]}-${m[4]} | IBC:$${m[5]} | Dias:${dias}\n`;
    }
    analysis += `  TOTAL PRE-1995: ${pre95Count} rows, ${pre95Dias} dias, ${(pre95Dias/7).toFixed(2)} semanas\n`;
    
    // Post-1995 regex
    let post95Text = splitIdx > -1 ? fullText.substring(splitIdx) : '';
    const post95Regex = /(\d{5,15})\s+(.{3,60}?)\s+(?:SI|NO)\s+(\d{4})(\d{2})\s+\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}\s+\S+\s+\$\s*([\d.,]+)\s+\$\s*[\d.,]+\s+\$\s*[\d.,\-]*\s*R?\s*(\d{1,3})\s+(\d{1,3})/g;
    let post95Count = 0, post95DiasRep = 0, post95DiasCot = 0;
    
    analysis += '\n--- POST-1995 ROWS ---\n';
    while ((m = post95Regex.exec(post95Text)) !== null) {
        const emp = m[2].trim().toUpperCase();
        if (emp.includes('RAZÓN SOCIAL') || emp.includes('NOMBRE') || emp === 'NIT') continue;
        const ibc = parseFloat(m[5].replace(/\./g,'').replace(',','.'));
        if (ibc < 1000) continue;
        post95Count++;
        const diasRep = parseInt(m[6]);
        const diasCot = parseInt(m[7]);
        post95DiasRep += diasRep;
        post95DiasCot += diasCot;
        analysis += `  ${post95Count}. NIT:${m[1]} | ${m[2].trim()} | ${m[3]}-${m[4]} | IBC:$${m[5]} | DiasRep:${diasRep} | DiasCot:${diasCot}\n`;
    }
    analysis += `  TOTAL POST-1995: ${post95Count} rows, DiasRep:${post95DiasRep}, DiasCot:${post95DiasCot}, Semanas(Cot/7):${(post95DiasCot/7).toFixed(2)}\n`;
    
    analysis += `\n--- GRAND TOTAL ---\n`;
    analysis += `  Total Dias: ${pre95Dias + post95DiasCot}\n`;
    analysis += `  Total Semanas: ${((pre95Dias + post95DiasCot)/7).toFixed(2)}\n`;
    
    document.getElementById('output').textContent += analysis;
}
</script>
</body>
</html>
